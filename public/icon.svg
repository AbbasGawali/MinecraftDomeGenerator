<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Isometric Voxel Dome Icon -->
  <rect x="6" y="6" width="88" height="88" rx="0" fill="#0f172a" stroke="#2563eb" stroke-width="4"/>
  
  <!-- Stepped Voxel Dome Silhouette -->
  <!-- Base layer -->
  <rect x="20" y="70" width="60" height="10" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Middle layer -->
  <rect x="28" y="58" width="44" height="12" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Upper layer -->
  <rect x="36" y="44" width="28" height="14" fill="#0ea5e9" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Dome apex -->
  <rect x="44" y="32" width="12" height="12" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
</svg>
